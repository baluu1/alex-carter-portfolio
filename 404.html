<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Alex Carter Studio</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2EEE7">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  /* one screen, same light/shadow edge as the hero */
  .nf {
    position: relative;
    isolation: isolate;
    min-height: 100svh;
    background: var(--ivory);
    display: grid;
    align-content: center;
    padding: var(--s5) var(--pad-x);
    overflow: clip;
  }
  .nf__shadow {
    position: absolute;
    inset: 0 0 0 auto;
    width: 44%;
    background: var(--ink);
    z-index: 0;
  }
  .nf__shaft {
    position: absolute;
    inset: 0 0 0 auto;
    width: 44%;
    z-index: 1;
    background: repeating-linear-gradient(
        104deg,
        transparent 0 92px,
        color-mix(in srgb, var(--ivory) 7%, transparent) 92px 150px);
    -webkit-mask-image: linear-gradient(158deg, #000 2%, transparent 58%);
            mask-image: linear-gradient(158deg, #000 2%, transparent 58%);
  }
  .nf__inner { position: relative; z-index: 2; }
  .nf__code {
    font-size: var(--fs-micro);
    letter-spacing: var(--tr-wide);
    text-transform: uppercase;
    color: var(--grey);
    margin-bottom: var(--s3);
  }
  .nf__title {
    font-family: var(--serif);
    font-size: var(--fs-display);
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin-bottom: var(--s3);
    max-width: 7.5em;          /* two lines, not four */
  }
  .nf__body { max-width: 40ch; margin-bottom: var(--s4); }
  @media (max-width: 767px) {
    .nf__shadow, .nf__shaft { inset: auto 0 0 0; width: 100%; height: 32%; }
    .nf__shaft {
      -webkit-mask-image: linear-gradient(174deg, #000 0%, transparent 62%);
              mask-image: linear-gradient(174deg, #000 0%, transparent 62%);
    }
  }
</style>
</head>
<body>
<main class="nf">
  <div class="nf__shadow" aria-hidden="true"></div>
  <div class="nf__shaft" aria-hidden="true"></div>
  <div class="nf__inner">
    <p class="nf__code">Error 404</p>
    <h1 class="nf__title">This frame doesn&rsquo;t exist.</h1>
    <p class="nf__body">The page you were looking for isn&rsquo;t here — it may have moved, or the link may be wrong.</p>
    <a class="btn btn--solid" href="/">Back to the studio</a>
  </div>
</main>
</body>
</html>
